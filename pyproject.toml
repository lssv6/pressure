[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pressure-monitor"
version = "1.0.0"
description = "Real-time plotting of two HX710B pressure sensors streamed from an Arduino"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "pyserial>=3.5",
    "numpy>=1.24",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
pressure-monitor = "pressure_monitor.app:main"

[tool.setuptools.packages.find]
include = ["pressure_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
